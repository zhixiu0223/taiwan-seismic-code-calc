name: Execute notebook & verify results

on:
  push:
    paths:
      - '**.ipynb'
      - '**/check_key_values.py'
      - '.github/workflows/execute-notebook.yml'
      - 'scripts/execute_notebook.py'
  pull_request:
    paths:
      - '**.ipynb'

jobs:
  run-and-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install nbclient nbformat ipykernel numpy
          python -m ipykernel install --user --name python3

      # 不寫死檔名/路徑,自動找出 repo 裡的 .ipynb 並執行(邏輯獨立成
      # scripts/execute_notebook.py,避免在 YAML 裡塞 heredoc 造成縮排問題)
      - name: Execute notebook (fails the build if any cell errors)
        run: python scripts/execute_notebook.py

      # 同樣動態找 check_key_values.py 的位置,不寫死路徑
      - name: Regression-check key numbers
        run: |
          set -e
          CHECK=$(find . -name "check_key_values.py" -not -path "./.git/*" | head -n 1)
          NB=$(find . -name "*.ipynb" -not -path "./.git/*" | head -n 1)
          if [ -z "$CHECK" ]; then
            echo "check_key_values.py not found, skipping regression check"
            exit 0
          fi
          echo "Running $CHECK against $NB"
          python "$CHECK" "$NB"
